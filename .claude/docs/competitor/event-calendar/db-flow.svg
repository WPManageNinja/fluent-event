<text x="40" y="46" font-size="18" font-weight="700" fill="#1c2b3a">The Events Calendar + Event Tickets — database write flow</text>
<text x="40" y="70" font-size="11" fill="#6a7684">Create event &#8594; add tickets &#8594; browse &#8594; buy &#8594; after. Colour = table the rows land in.</text>
<g>
<rect x="40" y="96" width="420" height="331" rx="6" fill="#fff" stroke="#8a99ab" stroke-width="1.2"/>
<path d="M40,102 a6,6 0 0 1 6,-6 h408 a6,6 0 0 1 6,6 v26 h-420 z" fill="#3d5a80"/>
<circle cx="58" cy="112" r="10" fill="#fff" opacity="0.9"/>
<text x="58" y="116" font-size="13" font-weight="700" fill="#3d5a80" text-anchor="middle">1</text>
<text x="76" y="116" font-size="13" font-weight="700" fill="#fff">CREATE EVENT</text>
<text x="450" y="140" font-size="9.5" font-style="italic" fill="#7a8694" text-anchor="end">admin</text>
<text x="52" y="155" font-size="9" font-weight="700" fill="#9aa6b2" letter-spacing="0.5">WRITES</text>
<rect x="52" y="169" width="9" height="9" rx="1.5" fill="#4a6fa5"/>
<text x="67" y="176" font-size="10" fill="#1a1a1a"><tspan font-weight="700" fill="#4a6fa5">wp_posts ×3</tspan><tspan fill="#4a5561">  event + venue + organizer</tspan></text>
<text x="68" y="197" font-size="9.3" fill="#8a94a0">post_type = tribe_events / tribe_venue / tribe_organizer</text>
<rect x="52" y="211" width="9" height="9" rx="1.5" fill="#6b7a89"/>
<text x="67" y="218" font-size="10" fill="#1a1a1a"><tspan font-weight="700" fill="#6b7a89">wp_postmeta ~28</tspan><tspan fill="#4a5561">  _EventStartDate, _EventEndDate,</tspan></text>
<text x="68" y="239" font-size="9.3" fill="#8a94a0">_EventTimezone, _EventCost, _EventVenueID,</text>
<text x="68" y="260" font-size="9.3" fill="#8a94a0">_EventOrganizerID, _Venue*, _Organizer*, _thumbnail_id</text>
<rect x="52" y="274" width="9" height="9" rx="1.5" fill="#b8863a"/>
<text x="67" y="281" font-size="10" fill="#1a1a1a"><tspan font-weight="700" fill="#b8863a">wp_terms / _taxonomy</tspan><tspan fill="#4a5561">  tribe_events_cat</tspan></text>
<rect x="52" y="295" width="9" height="9" rx="1.5" fill="#b8863a"/>
<text x="67" y="302" font-size="10" fill="#1a1a1a"><tspan font-weight="700" fill="#b8863a">wp_term_relationships</tspan><tspan fill="#4a5561">  + post_tag</tspan></text>
<rect x="52" y="316" width="9" height="9" rx="1.5" fill="#5c7a52"/>
<text x="67" y="323" font-size="10" fill="#1a1a1a"><tspan font-weight="700" fill="#5c7a52">tec_events</tspan><tspan fill="#4a5561">  1 upsert (UNIQUE post_id)</tspan></text>
<rect x="52" y="337" width="9" height="9" rx="1.5" fill="#5c7a52"/>
<text x="67" y="344" font-size="10" fill="#1a1a1a"><tspan font-weight="700" fill="#5c7a52">tec_occurrences</tspan><tspan fill="#4a5561">  1 insert (per occurrence)</tspan></text>
<rect x="52" y="358" width="9" height="9" rx="1.5" fill="#9a7bb0"/>
<text x="67" y="365" font-size="10" fill="#1a1a1a"><tspan font-weight="700" fill="#9a7bb0">wp_options</tspan><tspan fill="#4a5561">  known date range</tspan></text>
<text x="68" y="386" font-size="9.3" fill="#8a94a0">hook: save_post(15) -&gt; saveEventMeta;</text>
<text x="68" y="407" font-size="9.3" fill="#8a94a0">tec_* upsert deferred to end-of-request</text>
</g>
<g>
<rect x="500" y="96" width="420" height="268" rx="6" fill="#fff" stroke="#8a99ab" stroke-width="1.2"/>
<path d="M500,102 a6,6 0 0 1 6,-6 h408 a6,6 0 0 1 6,6 v26 h-420 z" fill="#3d5a80"/>
<circle cx="518" cy="112" r="10" fill="#fff" opacity="0.9"/>
<text x="518" y="116" font-size="13" font-weight="700" fill="#3d5a80" text-anchor="middle">2</text>
<text x="536" y="116" font-size="13" font-weight="700" fill="#fff">ADD TICKETS</text>
<text x="910" y="140" font-size="9.5" font-style="italic" fill="#7a8694" text-anchor="end">admin</text>
<text x="512" y="155" font-size="9" font-weight="700" fill="#9aa6b2" letter-spacing="0.5">WRITES</text>
<rect x="512" y="169" width="9" height="9" rx="1.5" fill="#4a6fa5"/>
<text x="527" y="176" font-size="10" fill="#1a1a1a"><tspan font-weight="700" fill="#4a6fa5">wp_posts</tspan><tspan fill="#4a5561">  1 ticket post</tspan></text>
<text x="528" y="197" font-size="9.3" fill="#8a94a0">post_type = tec_tc_ticket</text>
<rect x="512" y="211" width="9" height="9" rx="1.5" fill="#6b7a89"/>
<text x="527" y="218" font-size="10" fill="#1a1a1a"><tspan font-weight="700" fill="#6b7a89">wp_postmeta</tspan><tspan fill="#4a5561">  _price, _capacity, _stock,</tspan></text>
<text x="528" y="239" font-size="9.3" fill="#8a94a0">_stock_status, _ticket_start_date,</text>
<text x="528" y="260" font-size="9.3" fill="#8a94a0">_ticket_end_date, event-relation key</text>
<rect x="512" y="274" width="9" height="9" rx="1.5" fill="#6b7a89"/>
<text x="527" y="281" font-size="10" fill="#1a1a1a"><tspan font-weight="700" fill="#6b7a89">on event post</tspan><tspan fill="#4a5561">  _tribe_ticket_global_stock_level,</tspan></text>
<text x="528" y="302" font-size="9.3" fill="#8a94a0">_tribe_default_ticket_provider</text>
<text x="528" y="323" font-size="9.3" fill="#8a94a0">_stock = STORED counter (decremented on sale)</text>
<text x="528" y="344" font-size="9.3" fill="#8a94a0">_capacity = fixed, never decremented</text>
</g>
<g>
<rect x="960" y="96" width="420" height="310" rx="6" fill="#fff" stroke="#8a99ab" stroke-width="1.2"/>
<path d="M960,102 a6,6 0 0 1 6,-6 h408 a6,6 0 0 1 6,6 v26 h-420 z" fill="#4a7a52"/>
<circle cx="978" cy="112" r="10" fill="#fff" opacity="0.9"/>
<text x="978" y="116" font-size="13" font-weight="700" fill="#4a7a52" text-anchor="middle">3</text>
<text x="996" y="116" font-size="13" font-weight="700" fill="#fff">BROWSE</text>
<text x="1370" y="140" font-size="9.5" font-style="italic" fill="#7a8694" text-anchor="end">visitor</text>
<text x="972" y="155" font-size="9" font-weight="700" fill="#9aa6b2" letter-spacing="0.5">READS</text>
<rect x="972" y="169" width="9" height="9" rx="1.5" fill="#8a99ab"/>
<text x="987" y="176" font-size="10" fill="#1a1a1a"><tspan font-weight="700" fill="#8a99ab">wp_posts JOIN</tspan><tspan fill="#4a5561">  tec_occurrences</tspan></text>
<text x="988" y="197" font-size="9.3" fill="#8a94a0">dates come from tec_occurrences, NOT meta</text>
<rect x="972" y="211" width="9" height="9" rx="1.5" fill="#8a99ab"/>
<text x="987" y="218" font-size="10" fill="#1a1a1a"><tspan font-weight="700" fill="#8a99ab">wp_posts + meta</tspan><tspan fill="#4a5561">  tickets by _tec_tickets</tspan></text>
<text x="988" y="239" font-size="9.3" fill="#8a94a0">_commerce_event</text>
<text x="988" y="260" font-size="9.3" fill="#8a94a0">available = min( inventory, capacity, stock )</text>
<text x="988" y="281" font-size="9.3" fill="#8a94a0">  inventory = LIVE count of tec_tc_attendee</text>
<text x="988" y="302" font-size="9.3" fill="#8a94a0">  stock = STORED _stock counter</text>
<text x="972" y="323" font-size="9" font-weight="700" fill="#9aa6b2" letter-spacing="0.5">WRITE (add-to-cart only)</text>
<rect x="972" y="337" width="9" height="9" rx="1.5" fill="#9a7bb0"/>
<text x="987" y="344" font-size="10" fill="#1a1a1a"><tspan font-weight="700" fill="#9a7bb0">transient</tspan><tspan fill="#4a5561">  tc-cart-&lt;hash&gt;</tspan></text>
<rect x="972" y="358" width="9" height="9" rx="1.5" fill="#9a7bb0"/>
<text x="987" y="365" font-size="10" fill="#1a1a1a"><tspan font-weight="700" fill="#9a7bb0">cookie</tspan><tspan fill="#4a5561">  tec-tickets-commerce-cart</tspan></text>
<text x="988" y="386" font-size="9.3" fill="#8a94a0">no order/attendee rows on browse</text>
</g>
<g>
<rect x="1420" y="96" width="420" height="331" rx="6" fill="#fff" stroke="#8a99ab" stroke-width="1.2"/>
<path d="M1420,102 a6,6 0 0 1 6,-6 h408 a6,6 0 0 1 6,6 v26 h-420 z" fill="#4a7a52"/>
<circle cx="1438" cy="112" r="10" fill="#fff" opacity="0.9"/>
<text x="1438" y="116" font-size="13" font-weight="700" fill="#4a7a52" text-anchor="middle">4</text>
<text x="1456" y="116" font-size="13" font-weight="700" fill="#fff">BUY  (checkout)</text>
<text x="1830" y="140" font-size="9.5" font-style="italic" fill="#7a8694" text-anchor="end">visitor</text>
<text x="1432" y="155" font-size="9" font-weight="700" fill="#9aa6b2" letter-spacing="0.5">WRITES</text>
<rect x="1432" y="169" width="9" height="9" rx="1.5" fill="#4a6fa5"/>
<text x="1447" y="176" font-size="10" fill="#1a1a1a"><tspan font-weight="700" fill="#4a6fa5">wp_posts</tspan><tspan fill="#4a5561">  1 order post</tspan></text>
<text x="1448" y="197" font-size="9.3" fill="#8a94a0">post_type=tec_tc_order  status:</text>
<text x="1448" y="218" font-size="9.3" fill="#8a94a0">tec-tc-created -&gt; pending -&gt; completed</text>
<rect x="1432" y="232" width="9" height="9" rx="1.5" fill="#6b7a89"/>
<text x="1447" y="239" font-size="10" fill="#1a1a1a"><tspan font-weight="700" fill="#6b7a89">wp_postmeta ~15</tspan><tspan fill="#4a5561">  _tec_tc_order_items</tspan></text>
<text x="1448" y="260" font-size="9.3" fill="#8a94a0">(serialized cart), totals, purchaser_*, gateway_*</text>
<rect x="1432" y="274" width="9" height="9" rx="1.5" fill="#4a6fa5"/>
<text x="1447" y="281" font-size="10" fill="#1a1a1a"><tspan font-weight="700" fill="#4a6fa5">wp_posts ×N</tspan><tspan fill="#4a5561">  1 attendee / ticket</tspan></text>
<text x="1448" y="302" font-size="9.3" fill="#8a94a0">tec_tc_attendee  post_parent = order</text>
<rect x="1432" y="316" width="9" height="9" rx="1.5" fill="#6b7a89"/>
<text x="1447" y="323" font-size="10" fill="#1a1a1a"><tspan font-weight="700" fill="#6b7a89">~8 × N</tspan><tspan fill="#4a5561">  event, ticket, security_code,</tspan></text>
<text x="1448" y="344" font-size="9.3" fill="#8a94a0">full_name, email, price_paid</text>
<rect x="1432" y="358" width="9" height="9" rx="1.5" fill="#6b7a89"/>
<text x="1447" y="365" font-size="10" fill="#1a1a1a"><tspan font-weight="700" fill="#6b7a89">stock -=</tspan><tspan fill="#4a5561">  total_sales+=, _stock-=,</tspan></text>
<text x="1448" y="386" font-size="9.3" fill="#8a94a0">event _global_stock_level -=</text>
<text x="1448" y="407" font-size="9.3" fill="#8a94a0">attendees + stock fire at PENDING by default</text>
</g>
<g>
<rect x="1880" y="96" width="420" height="268" rx="6" fill="#fff" stroke="#8a99ab" stroke-width="1.2"/>
<path d="M1880,102 a6,6 0 0 1 6,-6 h408 a6,6 0 0 1 6,6 v26 h-420 z" fill="#3d5a80"/>
<circle cx="1898" cy="112" r="10" fill="#fff" opacity="0.9"/>
<text x="1898" y="116" font-size="13" font-weight="700" fill="#3d5a80" text-anchor="middle">5</text>
<text x="1916" y="116" font-size="13" font-weight="700" fill="#fff">AFTER  (check-in / refund)</text>
<text x="2290" y="140" font-size="9.5" font-style="italic" fill="#7a8694" text-anchor="end">admin</text>
<text x="1892" y="155" font-size="9" font-weight="700" fill="#9aa6b2" letter-spacing="0.5">CHECK-IN (meta flip)</text>
<rect x="1892" y="169" width="9" height="9" rx="1.5" fill="#6b7a89"/>
<text x="1907" y="176" font-size="10" fill="#1a1a1a"><tspan font-weight="700" fill="#6b7a89">wp_postmeta</tspan><tspan fill="#4a5561">  _checked_in = 1</tspan></text>
<text x="1908" y="197" font-size="9.3" fill="#8a94a0">_tec_tickets_commerce_checked_in (+details)</text>
<text x="1892" y="218" font-size="9" font-weight="700" fill="#9aa6b2" letter-spacing="0.5">MY-TICKETS (read)</text>
<rect x="1892" y="232" width="9" height="9" rx="1.5" fill="#8a99ab"/>
<text x="1907" y="239" font-size="10" fill="#1a1a1a"><tspan font-weight="700" fill="#8a99ab">tec_tc_attendee</tspan><tspan fill="#4a5561">  by post_parent / user_id</tspan></text>
<text x="1908" y="260" font-size="9.3" fill="#8a94a0">publish only</text>
<text x="1892" y="281" font-size="9" font-weight="700" fill="#9aa6b2" letter-spacing="0.5">REFUND</text>
<rect x="1892" y="295" width="9" height="9" rx="1.5" fill="#4a6fa5"/>
<text x="1907" y="302" font-size="10" fill="#1a1a1a"><tspan font-weight="700" fill="#4a6fa5">order status</tspan><tspan fill="#4a5561">  -&gt; tec-tc-refunded</tspan></text>
<rect x="1892" y="316" width="9" height="9" rx="1.5" fill="#6b7a89"/>
<text x="1907" y="323" font-size="10" fill="#1a1a1a"><tspan font-weight="700" fill="#6b7a89">stock restore</tspan><tspan fill="#4a5561">  total_sales-=, _stock+=</tspan></text>
<rect x="1892" y="337" width="9" height="9" rx="1.5" fill="#4a6fa5"/>
<text x="1907" y="344" font-size="10" fill="#1a1a1a"><tspan font-weight="700" fill="#4a6fa5">attendees</tspan><tspan fill="#4a5561">  -&gt; trash (archive)</tspan></text>
</g>
<path d="M466,118 H492" stroke="#5c6a78" stroke-width="2" marker-end="url(#ar)"/>
<path d="M926,118 H952" stroke="#5c6a78" stroke-width="2" marker-end="url(#ar)"/>
<path d="M1386,118 H1412" stroke="#5c6a78" stroke-width="2" marker-end="url(#ar)"/>
<path d="M1846,118 H1872" stroke="#5c6a78" stroke-width="2" marker-end="url(#ar)"/>
<rect x="40" y="467" width="2240" height="150" rx="6" fill="#f4f6f8" stroke="#8a99ab" stroke-width="1"/>
<text x="60" y="495" font-size="14" font-weight="700" fill="#1c2b3a">Same purchase (buyer, N tickets) — two schemas, very different row counts</text>
<rect x="60" y="511" width="10" height="10" rx="2" fill="#c0453b"/>
<text x="78" y="520" font-size="11.5" font-weight="700" fill="#8a2820">The Events Calendar + Event Tickets</text>
<text x="80" y="539" font-size="10.3" fill="#4a5561" font-family="Menlo,Consolas,monospace">1 tec_tc_order post  +  ~15 order-meta rows  (serialized _tec_tc_order_items blob)</text>
<text x="80" y="556" font-size="10.3" fill="#4a5561" font-family="Menlo,Consolas,monospace">N tec_tc_attendee posts  +  ~8 attendee-meta rows EACH  (post_parent = order)</text>
<text x="80" y="573" font-size="10.3" fill="#4a5561" font-family="Menlo,Consolas,monospace">+ status-log &amp; gateway-payload meta on every transition  +  stock counter writes</text>
<text x="80" y="590" font-size="10.3" fill="#4a5561" font-family="Menlo,Consolas,monospace">= dozens of post + EAV meta rows;  reads via meta_query joins + slug-string post_status</text>
<rect x="1230" y="511" width="10" height="10" rx="2" fill="#5c7a52"/>
<text x="1248" y="520" font-size="11.5" font-weight="700" fill="#3f5a37">Fluent Events (custom-table design)</text>
<text x="1250" y="539" font-size="10.3" fill="#4a5561" font-family="Menlo,Consolas,monospace">1 INSERT  wp_fevents_registrations   (buyer + payment + status as real columns)</text>
<text x="1250" y="556" font-size="10.3" fill="#4a5561" font-family="Menlo,Consolas,monospace">N INSERT  wp_fevents_guests          (one typed row per ticket = attendee)</text>
<text x="1250" y="573" font-size="10.3" fill="#4a5561" font-family="Menlo,Consolas,monospace">1 UPDATE  wp_fevents_ticket_types SET sold = sold + N   (single authoritative counter)</text>
<text x="1250" y="590" font-size="10.3" fill="#4a5561" font-family="Menlo,Consolas,monospace">= a few typed rows across 3 indexed tables;  reads = direct SELECT + real FKs</text>
</svg>
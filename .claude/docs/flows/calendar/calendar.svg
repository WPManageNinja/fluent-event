<text x="596" y="116" font-size="12.5" font-weight="700" fill="#0d9488">Sharing &amp; visibility</text>
<text x="596" y="138" font-size="9.3" fill="#475569">Public  —  anyone (incl. logged-out) browses + follows</text>
<text x="596" y="162" font-size="9.3" fill="#475569">Unlisted  —  reachable only via the link</text>
<text x="596" y="186" font-size="9.3" fill="#475569">Private  —  managers / invited only</text>
<text x="596" y="210" font-size="9.3" fill="#475569">Public page: shareable  /&lt;slug&gt;  ·  Follow button</text>
</g>

<rect x="0" y="0" width="980" height="634" fill="#f8fafc"/>
<text x="40" y="40" font-size="24" font-weight="700" fill="#0f172a">Fluent Events — Calendar Lifecycle &amp; Sharing</text>
<text x="40" y="60" font-size="12" fill="#64748b">Create → configure → share (public page) → events file under it → members follow → notify followers.</text>
<text x="580" y="350" font-size="10" font-weight="700" fill="#7c3aed" letter-spacing="0.5">NOTIFICATIONS  (calendar.*)</text>

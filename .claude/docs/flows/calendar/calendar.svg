<g><rect x="60" y="92" width="440" height="74" rx="9" fill="#ffffff" stroke="#4f46e5" stroke-width="1.8"/>
<rect x="60" y="92" width="6" height="74" rx="3" fill="#4f46e5"/>
<text x="76" y="114" font-size="13" font-weight="700" fill="#4f46e5">1 · Create calendar  (host / managers)</text>
<text x="76" y="132" font-size="8.8" fill="#475569">name · slug · description · logo / cover · visibility · settings</text>
<text x="76" y="146" font-size="8.8" fill="#475569">v1: hidden “Default Calendar” auto-created on the first event</text>
</g>
<g><rect x="60" y="192" width="440" height="64" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
<rect x="60" y="192" width="6" height="64" rx="3" fill="#16a34a"/>
<text x="76" y="214" font-size="13" font-weight="700" fill="#16a34a">2 · Configure</text>
<text x="76" y="232" font-size="8.8" fill="#475569">visibility (public / unlisted / private) · branding (logo, cover)</text>
<text x="76" y="246" font-size="8.8" fill="#475569">managers + caps · per-calendar notification prefs · insights</text>
</g>
<g><rect x="60" y="282" width="440" height="56" rx="9" fill="#ffffff" stroke="#0d9488" stroke-width="1.8"/>
<rect x="60" y="282" width="6" height="56" rx="3" fill="#0d9488"/>
<text x="76" y="304" font-size="13" font-weight="700" fill="#0d9488">3 · Share — public page</text>
<text x="76" y="322" font-size="8.8" fill="#475569">shareable URL  /&lt;slug&gt;  ·  members browse the calendar</text>
</g>
<g><rect x="60" y="364" width="440" height="58" rx="9" fill="#ffffff" stroke="#4338ca" stroke-width="1.8"/>
<rect x="60" y="364" width="6" height="58" rx="3" fill="#4338ca"/>
<text x="76" y="386" font-size="13" font-weight="700" fill="#4338ca">4 · Events filed under it</text>
<text x="76" y="404" font-size="8.8" fill="#475569">events carry calendar_id → grouped &amp; shown · insights aggregate</text>
</g>
<g><rect x="60" y="448" width="440" height="58" rx="9" fill="#ffffff" stroke="#14b8a6" stroke-width="1.8"/>
<rect x="60" y="448" width="6" height="58" rx="3" fill="#14b8a6"/>
<text x="76" y="470" font-size="13" font-weight="700" fill="#14b8a6">5 · Members follow</text>
<text x="76" y="488" font-size="8.8" fill="#475569">calendar_followers · one row per user (unique) · opt-in to updates</text>
</g>
<g><rect x="60" y="532" width="440" height="56" rx="9" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
<rect x="60" y="532" width="6" height="56" rx="3" fill="#475569"/>
<text x="76" y="554" font-size="13" font-weight="700" fill="#475569">6 · Manage</text>
<text x="76" y="572" font-size="8.8" fill="#475569">unfollow · edit settings · delete</text>
</g>
<g><rect x="580" y="366" width="360" height="44" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.4"/>
<text x="592" y="384" font-size="10.5" font-weight="700" fill="#7c3aed">calendar.new_event</text>
<text x="592" y="398" font-size="8.8" fill="#7c3aed" opacity="0.85">→ followers  (event published here)</text>
</g>
<g><rect x="580" y="418" width="360" height="44" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.4"/>
<text x="592" y="436" font-size="10.5" font-weight="700" fill="#7c3aed">calendar.event_updated</text>
<text x="592" y="450" font-size="8.8" fill="#7c3aed" opacity="0.85">→ followers  (FR-8.9)</text>
</g>
<g><rect x="580" y="92" width="360" height="164" rx="9" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>

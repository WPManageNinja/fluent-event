<path d="M275.0,554 C275.0,594 275.0,542 275.0,582" fill="none" stroke="#64748b" stroke-width="1.9" opacity="0.8" marker-end="url(#ar64748b)"/>
<rect x="247" y="560" width="56" height="14" rx="3" fill="#f8fafc" opacity="0.92"/>
<text x="275" y="570" font-size="8.6" fill="#64748b" text-anchor="middle">end time</text>

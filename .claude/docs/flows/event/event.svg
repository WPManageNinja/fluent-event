<rect x="503" y="382" width="44" height="14" rx="3" fill="#f8fafc" opacity="0.92"/>
<text x="525" y="392" font-size="8.6" fill="#94a3b8" text-anchor="middle">manage</text>
<g><rect x="60" y="92" width="430" height="70" rx="9" fill="#ffffff" stroke="#4f46e5" stroke-width="1.8"/>
<rect x="60" y="92" width="6" height="70" rx="3" fill="#4f46e5"/>
<text x="76" y="114" font-size="13" font-weight="700" fill="#4f46e5">1 · Create event  (draft)</text>
<text x="76" y="132" font-size="8.8" fill="#475569">content · date + timezone · location / online meeting</text>
<text x="76" y="146" font-size="8.8" fill="#475569">calendar · capacity · visibility · form · payment · cover</text>
</g>
<g><rect x="60" y="188" width="430" height="50" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
<rect x="60" y="188" width="6" height="50" rx="3" fill="#16a34a"/>
<text x="76" y="210" font-size="13" font-weight="700" fill="#16a34a">2 · Publish → live</text>
<text x="76" y="228" font-size="8.8" fill="#475569">discoverable per visibility · filed under a calendar</text>
</g>
<g><rect x="60" y="266" width="430" height="132" rx="9" fill="#ffffff" stroke="#4338ca" stroke-width="1.8"/>
<rect x="60" y="266" width="6" height="132" rx="3" fill="#4338ca"/>
<text x="76" y="288" font-size="13" font-weight="700" fill="#4338ca">3 · Members join</text>
<text x="76" y="306" font-size="8.8" fill="#475569">open + space   →   Attending</text>
<text x="76" y="320" font-size="8.8" fill="#475569">approval   →   Requested   →   host Approve / Decline   →   Approved</text>
<text x="76" y="334" font-size="8.8" fill="#475569">paid   →   Pay (Paymattic → webhook)   →   Attending</text>
<text x="76" y="348" font-size="8.8" fill="#475569">full   →   Waitlisted   →   auto-promote when a spot frees</text>
<text x="76" y="362" font-size="8.8" fill="#475569">no account   →   auto-register + email code → auto-login (FR-1)</text>
</g>
<g><rect x="60" y="426" width="430" height="50" rx="9" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
<rect x="60" y="426" width="6" height="50" rx="3" fill="#d97706"/>
<text x="76" y="448" font-size="13" font-weight="700" fill="#d97706">4 · Reminder before start</text>
<text x="76" y="466" font-size="8.8" fill="#475569">Action Scheduler · scheduled job</text>
</g>
<g><rect x="60" y="504" width="430" height="50" rx="9" fill="#ffffff" stroke="#4f46e5" stroke-width="1.8"/>
<rect x="60" y="504" width="6" height="50" rx="3" fill="#4f46e5"/>
<text x="76" y="526" font-size="13" font-weight="700" fill="#4f46e5">5 · Event live → check-in</text>
<text x="76" y="544" font-size="8.8" fill="#475569">guests marked checked_in</text>
</g>
<g><rect x="60" y="582" width="430" height="50" rx="9" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
<rect x="60" y="582" width="6" height="50" rx="3" fill="#475569"/>
<text x="76" y="604" font-size="13" font-weight="700" fill="#475569">6 · Ended</text>
<text x="76" y="622" font-size="8.8" fill="#475569">recurring → generates the next occurrence</text>
</g>
<g><rect x="560" y="192" width="360" height="40" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.4"/>
<text x="572" y="210" font-size="10.5" font-weight="700" fill="#7c3aed">calendar.new_event</text>
<text x="572" y="224" font-size="8.8" fill="#7c3aed" opacity="0.85">→ calendar followers</text>
</g>
<g><rect x="560" y="266" width="360" height="38" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.4"/>
<text x="572" y="283" font-size="10.5" font-weight="700" fill="#7c3aed">event.join_requested</text>
<text x="572" y="296" font-size="8.8" fill="#7c3aed" opacity="0.85">→ host</text>
</g>
<g><rect x="560" y="308" width="360" height="38" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.4"/>
<text x="572" y="325" font-size="10.5" font-weight="700" fill="#7c3aed">event.join_accepted / declined</text>
<text x="572" y="338" font-size="8.8" fill="#7c3aed" opacity="0.85">→ member</text>
</g>
<g><rect x="560" y="350" width="360" height="40" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.4"/>
<text x="572" y="368" font-size="10.5" font-weight="700" fill="#7c3aed">event.payment_received</text>
<text x="572" y="382" font-size="8.8" fill="#7c3aed" opacity="0.85">→ host + member</text>
</g>
<g><rect x="560" y="426" width="360" height="40" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.4"/>
<text x="572" y="444" font-size="10.5" font-weight="700" fill="#7c3aed">event.reminder</text>
<text x="572" y="458" font-size="8.8" fill="#7c3aed" opacity="0.85">→ guests</text>
</g>
<g><rect x="560" y="500" width="360" height="132" rx="9" fill="#fff1f2" stroke="#b91c1c" stroke-width="1.6"/>
<rect x="560" y="500" width="6" height="132" rx="3" fill="#b91c1c"/>
<text x="576" y="524" font-size="12.5" font-weight="700" fill="#b91c1c">Host may edit anytime</text>
<text x="576" y="546" font-size="9.4" fill="#475569">Update  →  notify guests  (event.updated)</text>
<text x="576" y="568" font-size="9.4" fill="#475569">Cancel  →  Cancelled  →  guests  (event.cancelled)</text>
<text x="576" y="590" font-size="9.4" fill="#475569">Delete (soft)  →  notify confirmed guests</text>
</g>
<g transform="translate(40,664)">
<line x1="0" y1="-3" x2="26" y2="-3" stroke="#64748b" stroke-width="1.9" marker-end="url(#ar64748b)"/>
<text x="32" y="0" font-size="9.5" fill="#334155">lifecycle step</text>
<line x1="180" y1="-3" x2="206" y2="-3" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#ar7c3aed)"/>
<text x="212" y="0" font-size="9.5" fill="#334155">notification fired</text>
<line x1="360" y1="-3" x2="386" y2="-3" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#ar94a3b8)"/>
<text x="392" y="0" font-size="9.5" fill="#334155">host action</text>
</g>
</svg>

<text x="275" y="177" font-size="8.6" fill="#64748b" text-anchor="middle">publish</text>
<path d="M275.0,238 C275.0,278 275.0,226 275.0,266" fill="none" stroke="#64748b" stroke-width="1.9" opacity="0.8" marker-end="url(#ar64748b)"/>

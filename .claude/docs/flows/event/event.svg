<rect x="0" y="0" width="960" height="690" fill="#f8fafc"/>
<text x="40" y="40" font-size="24" font-weight="700" fill="#0f172a">Fluent Events — Event Lifecycle</text>
<text x="40" y="60" font-size="12" fill="#64748b">From create → publish → join → remind → live → end. Violet = a notification (event.*) fired at that step.</text>
<text x="560" y="180" font-size="10" font-weight="700" fill="#7c3aed" letter-spacing="0.5">NOTIFICATIONS  (event.*)</text>
<path d="M275.0,162 C275.0,202 275.0,148 275.0,188" fill="none" stroke="#64748b" stroke-width="1.9" opacity="0.8" marker-end="url(#ar64748b)"/>

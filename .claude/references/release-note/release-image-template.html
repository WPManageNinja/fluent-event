<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FluentEvent - Release Image Template</title>
<style>
  /* ================================================================
     EASY TWEAK ZONE — change colors, fonts, spacing here
     ================================================================ */
  :root {
    --fe-accent: #2F3AB0;
    --fe-accent-dark: #232C8A;
    --fe-accent-soft: #9BA1E3;
    --fe-text: #2C2C2C;
    --fe-muted: #4E5D78;
    --fe-bg: #FBFBFE;
    --fe-coral: #FF6B4A;
    --fe-gray-stroke: #D8D8DE;

    --banner-pad: 80px;
    --radius-card: 20px;
    --radius-pill: 999px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: #e9e9f2;
    padding: 40px;
  }

  /* ================================================================
     BANNER — 1200 × 630 (standard OG / featured image size)
     ================================================================ */
  .banner {
    width: 1200px;
    height: 630px;
    background: var(--fe-bg);
    position: relative;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0, 0, 50, 0.08);
  }

  /* Decorative background circles */
  .bg-circle { position: absolute; border-radius: 50%; pointer-events: none; }
  .bg-circle.c1 { width: 560px; height: 560px; background: var(--fe-accent); opacity: 0.05; top: 410px; left: -340px; }
  .bg-circle.c2 { width: 560px; height: 560px; background: var(--fe-accent-soft); opacity: 0.14; top: -330px; right: -320px; }
  .bg-circle.c3 { width: 260px; height: 260px; background: var(--fe-accent); opacity: 0.06; bottom: -70px; right: -35px; }

  /* ================================================================
     LAYOUT — two columns
     ================================================================ */
  .content {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: flex;
    padding: var(--banner-pad);
    gap: 30px;
  }

  .left-col {
    width: 570px;
    display: flex;
    flex-direction: column;
  }

  .right-col {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ================================================================
     BADGE — properly padded pill
     ================================================================ */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 12px 26px;
    background: white;
    border: 2px solid var(--fe-accent);
    border-radius: var(--radius-pill);
    font-size: 20px;
    font-weight: 500;
    color: var(--fe-accent);
    width: fit-content;
    margin-bottom: 48px;
    line-height: 1;
  }
  .badge .dot {
    width: 12px;
    height: 12px;
    background: var(--fe-accent);
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ================================================================
     TITLE + TAGLINE
     ================================================================ */
  .title {
    font-size: 62px;
    font-weight: 700;
    line-height: 1.08;
    color: var(--fe-text);
    letter-spacing: -0.02em;
  }
  .title .line2 {
    color: var(--fe-accent);
    display: block;
  }
  .tagline {
    font-size: 22px;
    font-weight: 400;
    color: var(--fe-muted);
    margin-top: 26px;
    line-height: 1.4;
  }

  /* Logo pinned to bottom of left column */
  .logo { margin-top: auto; }
  .logo img.logo-img { display: block; height: 58px; width: auto; }

  /* ================================================================
     RIGHT-SIDE ILLUSTRATION — generic components
     ================================================================ */

  /* Store cards (used for migration flow, provider cards, etc.) */
  .store {
    width: 148px;
    height: 168px;
    border-radius: var(--radius-card);
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
  }
  .store.light {
    background: white;
    border: 1.5px solid var(--fe-gray-stroke);
    color: var(--fe-muted);
  }
  .store.dark {
    background: var(--fe-accent);
    color: white;
  }
  .store-name {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.15;
  }
  .store-sub {
    font-size: 11px;
    font-weight: 500;
    opacity: 0.75;
    margin-top: -4px;
    letter-spacing: 0.01em;
  }
  .store-icon { flex-shrink: 0; display: flex; align-items: center; justify-content: center; }

  /* Arrow between cards */
  .arrow {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: var(--fe-accent);
  }
  .arrow-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--fe-accent);
  }
  .arrow-shape { display: block; }

  /* Illustration container */
  .illustration {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }

  .flow {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  /* Checkmark pill badges */
  .includes {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-top: 2px;
  }
  .includes-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--fe-muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .pills {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 10px;
    max-width: 380px;
  }
  .pill {
    background: white;
    border: 1px solid #E3E3EE;
    border-radius: var(--radius-pill);
    padding: 8px 16px 8px 12px;
    font-size: 13px;
    font-weight: 600;
    color: var(--fe-accent);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    line-height: 1;
    white-space: nowrap;
  }
  .pill .check {
    width: 14px;
    height: 14px;
    background: var(--fe-accent);
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .pill .check svg { display: block; }
</style>
</head>
<body>

<div class="banner">
  <div class="bg-circle c1"></div>
  <div class="bg-circle c2"></div>
  <div class="bg-circle c3"></div>

  <div class="content">

    <!-- ========== LEFT: Text ========== -->
    <div class="left-col">

      <!-- CHANGE: Badge text per release -->
      <div class="badge">
        <span class="dot"></span>
        <span>Release 1.x.x</span>
      </div>

      <!-- CHANGE: Title per release -->
      <h1 class="title">
        Title Line One
        <span class="line2">Title Line Two</span>
      </h1>

      <!-- CHANGE: Tagline per release -->
      <p class="tagline">Short description of the release. One sentence.</p>

      <!-- FIXED: FluentEvent logo (never change) -->
      <div class="logo">
        <img class="logo-img" alt="FluentEvent" src="fe-logo.svg">
      </div>
    </div>

    <!-- ========== RIGHT: Illustration (CHANGE per release) ========== -->
    <div class="right-col">
      <!-- Replace this entire div's content for each release -->
      <div class="illustration">
        <!-- Your custom illustration goes here -->
      </div>
    </div>

  </div>
</div>

</body>
</html>
